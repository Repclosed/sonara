[package]
name = "sonara_core"
version = "0.1.0"
edition = "2021"
description = "Sonara native performance core: audio buffer cache, tag parsing and FFT spectrum analysis"
license = "GPL-3.0-only"
publish = false

[lib]
name = "sonara_core"
crate-type = ["cdylib"]

[dependencies]
jni = "0.21"
lofty = { version = "0.21", default-features = false, features = ["id3v2", "mp4", "vorbis"] }
rustfft = "6.2"
once_cell = "1.19"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 1
